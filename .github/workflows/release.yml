name: Build AyuGram APK
on:
  push:
    branches: [rewrite]
  workflow_dispatch:

jobs:
  # Fast gate: Java-only compile (~10-15 min) to catch code errors
  # ~20 min before the full release build would. Runs in parallel.
  compile-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-33" "build-tools;33.0.1"

      - name: Install NDK r21e (pinned 21.4.7075529)
        run: |
          cd /tmp
          curl -sL -o ndk-r21e.zip https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          mkdir -p "$ANDROID_HOME/ndk/21.4.7075529"
          unzip -q ndk-r21e.zip -d ndk-tmp
          cp -a ndk-tmp/android-ndk-r21e/. "$ANDROID_HOME/ndk/21.4.7075529/"
          rm -rf ndk-tmp ndk-r21e.zip

      - name: Install CMake 3.10.2 (pinned)
        run: |
          cd /tmp
          curl -sL -o cmake-310.zip https://dl.google.com/android/repository/cmake-3.10.2-linux-x86_64.zip
          mkdir -p "$ANDROID_HOME/cmake/3.10.2.4988404"
          unzip -q cmake-310.zip -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          rm -f cmake-310.zip

      - name: Write dummy local/api.properties
        run: |
          mkdir -p local
          printf 'APP_ID=6246784\nAPP_HASH=dummyhash0000000000000000000000\n' > local/api.properties

      - name: Compile Java only
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:compileBetaDebugJavaWithJavac

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_HARDLINK: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=0
          for name in APP_ID APP_HASH SIGNING_KEY_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set (repo Settings -> Secrets and variables -> Actions)"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Write local/api.properties
        run: |
          mkdir -p local
          cat > local/api.properties <<'EOF'
          APP_ID=${{ secrets.APP_ID }}
          APP_HASH=${{ secrets.APP_HASH }}
          SIGNING_KEY_STORE_PASSWORD=${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}
          EOF
          echo "keys present: $(cut -d= -f1 local/api.properties | tr '\n' ' ')"

      - name: Validate credential shapes (lengths only, never values)
        run: |
          python3 -c "
          ok = True
          expect = {'APP_ID': 8, 'APP_HASH': 32}
          seen = {}
          f = open('local/api.properties', encoding='utf-8')
          lines = [l.rstrip('\n') for l in f]
          print('line count:', len(lines))
          import unicodedata
          for l in lines:
              s = l.strip()
              if not s or s.startswith('#') or '=' not in s:
                  print('BAD LINE SHAPE')
                  ok = False
                  continue
              k, v = s.split('=', 1)
              cats = sorted(set(unicodedata.category(c) for c in v))
              print(k, 'len=', len(v), 'ws=', any(c.isspace() for c in v), 'cats=', cats)
              seen[k] = len(v)
          for k, n in expect.items():
              if seen.get(k) != n:
                  print('MISMATCH:', k)
                  ok = False
          raise SystemExit(0 if ok else 1)
          "

      - name: Free disk space
        run: |
          sudo apt-get remove -y '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli firefox mono-devel libgl1-mesa-dri || true
          sudo rm -rf /usr/share/dotnet/ /usr/local/graalvm/ /usr/local/.ghcup/ /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo apt-get install -y bison gcc make curl ninja-build ccache
          df -h

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ccache
          restore-keys: ccache

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-33" "build-tools;33.0.1"

      - name: Install NDK r21e (pinned 21.4.7075529)
        run: |
          cd /tmp
          curl -sL -o ndk-r21e.zip https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          mkdir -p "$ANDROID_HOME/ndk/21.4.7075529"
          unzip -q ndk-r21e.zip -d ndk-tmp
          cp -a ndk-tmp/android-ndk-r21e/. "$ANDROID_HOME/ndk/21.4.7075529/"
          rm -rf ndk-tmp ndk-r21e.zip
          cat "$ANDROID_HOME/ndk/21.4.7075529/source.properties"

      - name: Install CMake 3.10.2 (pinned)
        run: |
          cd /tmp
          curl -sL -o cmake-310.zip https://dl.google.com/android/repository/cmake-3.10.2-linux-x86_64.zip
          mkdir -p "$ANDROID_HOME/cmake/3.10.2.4988404"
          unzip -q cmake-310.zip -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          rm -f cmake-310.zip
          cat "$ANDROID_HOME/cmake/3.10.2.4988404/source.properties"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-afat-release
          path: TMessagesProj/build/outputs/apk/afat/release/*.apk
