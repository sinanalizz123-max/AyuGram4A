name: Rebase v12 shell build
# Stage 1: clone official master @ pin, apply identity overlay, green shell APK.
# Manual dispatch only — does not interfere with the 9.6.6 line.
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Gradle task'
        type: choice
        default: 'assembleArm64Debug'
        options:
          - assembleArm64Debug
          - assembleAfatDebug
          - assembleAfatRelease

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_HARDLINK: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=0
          for name in APP_ID APP_HASH SIGNING_KEY_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD SIGNING_KEYSTORE_B64; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}

      - name: Clone official master at pin
        run: |
          SHA=$(cat REBASE_SHA | tr -d '[:space:]')
          echo "pin=$SHA"
          git clone https://github.com/DrKLO/Telegram.git src
          cd src
          git checkout "$SHA"
          git submodule update --init --depth 1 --recursive
          git submodule status | head -12
          git log --oneline -1

      - name: Apply identity overlay
        run: |
          tar -xzf overlay-rebase.tar.gz -C src
          echo "--- overlay files ---"
          tar -tzf overlay-rebase.tar.gz | wc -l
          git -C src status -sb | head -15

      - name: Write local/api.properties
        run: |
          mkdir -p src/local
          cat > src/local/api.properties <<'EOF'
          APP_ID=${{ secrets.APP_ID }}
          APP_HASH=${{ secrets.APP_HASH }}
          SIGNING_KEY_STORE_PASSWORD=${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}
          EOF
          echo "keys present: $(cut -d= -f1 src/local/api.properties | tr '\n' ' ')"

      - name: Restore release keystore + verify unlock
        run: |
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > src/TMessagesProj/config/extera.jks
          keytool -list -keystore src/TMessagesProj/config/extera.jks -storepass "$SIGNING_KEY_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" -keypass "$SIGNING_KEY_PASSWORD" > /dev/null && echo "keystore unlock: OK"
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Free disk space
        run: |
          sudo apt-get remove -y '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli firefox mono-devel libgl1-mesa-dri || true
          sudo rm -rf /usr/share/dotnet/ /usr/local/graalvm/ /usr/local/.ghcup/ /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo apt-get install -y bison gcc make curl ninja-build ccache
          df -h

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: rebase-ccache
          restore-keys: rebase-ccache

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install NDK 27.2.12479018
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"
          cat "$ANDROID_HOME/ndk/27.2.12479018/source.properties"

      - name: Build with Gradle
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew ${TASK:-assembleArm64Debug}
        env:
          TASK: ${{ inputs.task }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rebase-shell-apk
          path: src/TMessagesProj_App/build/outputs/apk/**/*.apk
